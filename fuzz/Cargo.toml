[workspace]
members = ["."]

[package]
name = "dcbor-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "owned_lifecycle"
path = "fuzz_targets/owned_lifecycle.rs"
test = false
doc = false
bench = false

[dependencies]
dcbor = { path = "..", features = ["derive", "num-bigint", "hashbrown"] }
dcbor-test-support = { path = "../tests/support" }
# Same revision as the dcbor manifest: usrbinkat/hashbrown feat/map-bucket-index.
hashbrown = { version = "=0.17.1", git = "https://github.com/usrbinkat/hashbrown", rev = "0fbe75be38372034b884d347419994d5fec0bc7d" }
num-bigint = "0.4.6"
half = "2.4.1"
libfuzzer-sys = "0.4"
unicode-normalization = "=0.1.25"

[[bin]]
name = "schema_schedule"
path = "fuzz_targets/schema_schedule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nested"
path = "fuzz_targets/nested.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numeric"
path = "fuzz_targets/numeric.rs"
test = false
doc = false
bench = false

[[bin]]
name = "refusals"
path = "fuzz_targets/refusals.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "representations"
path = "fuzz_targets/representations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_schedule"
path = "fuzz_targets/decode_schedule.rs"
test = false
doc = false
bench = false
