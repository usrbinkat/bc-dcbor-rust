[package]
name = "dcbor-cddl-check"
version = "0.0.0"
edition = "2024"
publish = false
description = "The CDDL every derive emits, checked against the data items the derived decoders accept, an independent CDDL validator the oracle."
license = "BSD-2-Clause-Patent"

[lib]
path = "src/lib.rs"

[dependencies]
# The derives under check (`derive`) and the decoders whose accepted
# domains are compared with their CDDL. `std` and nothing else: the
# validator below needs std, so this package is a std-domain check only;
# without dcbor's defaults, as every test package of this workspace states
# its dcbor features itself.
dcbor = { path = "../..", default-features = false, features = ["std", "derive"] }
# The independent oracle: an RFC 8610 implementation validating CBOR bytes
# against CDDL text (`validate_cbor_from_slice`). Pinned by revision, the
# identity: usrbinkat/cddl branch fix/cbor-range-bytes-and-foreign-tags at
# fbba0a7, anweiss/cddl main c4c8d29 plus five commits (the fourth and fifth
# change the fork's own tests only). Two correct the
# validator where release 0.10.7 admitted items RFC 8610 refuses: a byte
# string matched against an integer range by its length without `.size`
# (Section 2.2.2.1, 3.8.1), and any tag other than 0, 1, 33 or a bignum tag
# satisfying every prelude type (Appendix D); the third, `unsigned` and
# `integer` admitting their bignum tags, is what the tag fix rests on. The
# feature citations below were read at release 0.10.7 (938a931); each
# feature still exists at fbba0a7 (its Cargo.toml [features]), and the
# cited lines are not re-read there. Each feature enabled, and why:
# - std: the validator module exists only under it (src/lib.rs:530), and
#   without it the build script refuses unless a no_std parser is generated
#   (build.rs:15-18);
# - cbor: the CBOR validator and its entry point (src/lib.rs:545-550,
#   src/validator/cbor.rs:1-3);
# - additional-controls: needed to compile the CBOR path at all, whose
#   `CDDL::validate_cbor` calls the three-argument validator constructor
#   unconditionally (src/validator/mod.rs:308);
# - ast-span: needed to compile the CBOR path at all, whose non-span arms of
#   `visit_identifier` name an undefined `value` (src/validator/cbor.rs:3710);
# - json: needed to compile the validator module at all, whose
#   `CDDL::validate_json`, beside `validate_cbor`, names the JSON validator
#   under no feature gate (src/validator/mod.rs:273-294).
# Not enabled: csv-validate, freezer, ast-comments, ast-parent, each gating
# modules or variants outside the CBOR path (src/validator/csv_validator.rs:2,
# src/validator/cbor.rs:1530 and :1552).
cddl = { git = "https://github.com/usrbinkat/cddl.git", rev = "fbba0a775449ffc6a56623c7926d936be035323d", default-features = false, features = [
    "std",
    "cbor",
    "json",
    "additional-controls",
    "ast-span",
] }

[lints]
workspace = true
