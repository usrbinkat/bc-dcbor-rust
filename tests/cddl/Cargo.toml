[package]
name = "dcbor-cddl-check"
version = "0.0.0"
edition = "2024"
publish = false
description = "The CDDL every derive emits, checked against the data items the derived decoders accept, an independent CDDL validator the oracle."
license = "BSD-2-Clause-Patent"

[lib]
path = "src/lib.rs"

[dependencies]
# The derives under check (`derive`) and the decoders whose accepted
# domains are compared with their CDDL. `std` and nothing else: the
# validator below needs std, so this package is a std-domain check only;
# without dcbor's defaults, as every test package of this workspace states
# its dcbor features itself.
dcbor = { path = "../..", default-features = false, features = ["std", "derive"] }
# The independent oracle: an RFC 8610 implementation validating CBOR bytes
# against CDDL text (`validate_cbor_from_slice`). Pinned by revision, the
# identity: usrbinkat/cddl branch fix/cbor-range-bytes-and-foreign-tags at
# 1e2d11a, anweiss/cddl main c4c8d29 plus nine commits (the fourth, fifth and
# ninth change the fork's own tests only; the sixth pins pest 2.9.6). Four
# correct the validator where upstream admits items the RFCs refuse, or
# refuses items they admit:
# - a byte string matched against an integer range by its length without
#   `.size` (RFC 8610, Sections 2.2.2.1 and 3.8.1);
# - any tag other than 0, 1, 33 or a bignum tag satisfying every prelude type
#   (RFC 8610, Appendix D), resting on the third commit, `unsigned` and
#   `integer` admitting their bignum tags;
# - the seventh: `.regexp`, `.pcre`, `.iregexp` and `.abnf` accepting any text
#   holding a match. XSD regular expressions are implicitly anchored (RFC 8610,
#   Section 3.8.3; XML Schema Part 2, Appendix F) and an `.abnf` controller is
#   one element matched by the whole target (RFC 9165, Section 3), so a rule
#   such as `tstr .regexp "[\u0000-\u007F]*"` denotes exactly the ASCII texts;
# - the eighth: `.regexp` read by the Appendix F grammar alone (another
#   dialect's constructs refused, `^`/`$` ordinary characters), and a map key
#   type constrained by a control (`tstr .regexp "a" => uint`) matched against
#   each key rather than against the map.
# Each feature enabled, and why:
# - std: the validator module exists only under it (src/lib.rs), and without
#   it the build script refuses unless a no_std parser is generated
#   (build.rs);
# - cbor: the CBOR validator and its entry point `validate_cbor_from_slice`
#   (src/validator/mod.rs, src/validator/cbor.rs);
# - additional-controls: the three-argument validator constructor the CBOR
#   path calls, and `.abnf`/`.abnfb` (src/validator/control.rs);
# - ast-span: the CBOR path's non-span arms of `visit_identifier` do not
#   compile (src/validator/cbor.rs);
# - json: `CDDL::validate_json`, beside `validate_cbor`, names the JSON
#   validator under no feature gate (src/validator/mod.rs).
# Not enabled: csv-validate, freezer, ast-comments, ast-parent, each gating
# modules or variants outside the CBOR path; `.regexp` needs none of them.
cddl = { git = "https://github.com/usrbinkat/cddl.git", rev = "1e2d11a33c7ae5355ab57209495ff950414b41e6", default-features = false, features = ["std", "cbor", "json", "additional-controls", "ast-span"] }

[lints]
workspace = true
